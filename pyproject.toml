[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sycbench"
version = "0.1.0"
description = "Template-driven datasets and outcome scoring for LLM sycophancy studies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Lars Malmqvist"}]
dependencies = []

[project.scripts]
sycbench = "sycbench.__main__:main"

[project.urls]
Repository = "https://github.com/lmlearning/SycBench"
Issues = "https://github.com/lmlearning/SycBench/issues"

[tool.setuptools.packages.find]
include = ["sycbench*"]
